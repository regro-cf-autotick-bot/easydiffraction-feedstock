context:
  name: easydiffraction
  version: "0.18.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/easydiffraction-${{ version }}.tar.gz
  sha256: 8e3f9e0d6f93a34b82960ec43807822e0a14e3dcb8ee92f6b91dbed0fd684bb5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - versioningit
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - asciichartpy
    - pooch
    - typer
    - rich
    - varname
    - asteval
    - scipy
    - sympy
    - lmfit
    - bumps
    - dfo-ls
    - gemmi
    - cryspy
    - crysfml
    - diffpy.pdffit2
    - diffpy.utils
    - uncertainties
    - h5py
    - typeguard
    - darkdetect
    - pandas
    - plotly
    - arviz
    - py3Dmol

tests:
  - python:
      imports:
        - easydiffraction
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://easydiffraction.org/
  summary: Making diffraction data analysis and modelling easy
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MridulS
