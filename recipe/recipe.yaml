context:
  name: easydiffraction
  version: "0.19.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/easydiffraction-${{ version }}.tar.gz
  sha256: 15fbaafccbe3fd58d84127a7dee50fc21643a74ccdc2ad4fb37649d51aa34238

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - versioningit
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - asciichartpy
    - pooch
    - typer
    - rich
    - varname
    - asteval
    - scipy
    - sympy
    - lmfit
    - bumps
    - dfo-ls
    - gemmi
    - cryspy >=0.12.1
    - crysfml >=0.7.0
    - diffpy.pdffit2
    - diffpy.utils
    - uncertainties
    - h5py
    - typeguard
    - darkdetect
    - pandas
    - plotly
    - pillow
    - pybaselines >=1.1

tests:
  - python:
      imports:
        - easydiffraction
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://easydiffraction.org/
  summary: Making diffraction data analysis and modelling easy
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MridulS
